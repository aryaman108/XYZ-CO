<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Recruitment team reviewing candidate profiles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#f6f8fc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#6b4bff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c9a7"/>
      <stop offset="1" stop-color="#00a4e0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="520" fill="url(#bg)"/>

  <!-- soft background shapes -->
  <circle cx="500" cy="80" r="110" fill="#2f6bff" opacity=".07"/>
  <circle cx="80" cy="450" r="130" fill="#00c9a7" opacity=".08"/>

  <!-- main dashboard card -->
  <g>
    <rect x="70" y="80" width="330" height="300" rx="20" fill="#fff" opacity=".97"/>
    <rect x="70" y="80" width="330" height="54" rx="20" fill="url(#blue)"/>
    <rect x="70" y="114" width="330" height="20" fill="url(#blue)"/>
    <circle cx="98" cy="107" r="6" fill="#fff" opacity=".85"/>
    <circle cx="116" cy="107" r="6" fill="#fff" opacity=".55"/>
    <circle cx="134" cy="107" r="6" fill="#fff" opacity=".35"/>
    <rect x="250" y="100" width="130" height="14" rx="7" fill="#fff" opacity=".35"/>

    <!-- candidate rows -->
    <g>
      <rect x="94" y="156" width="282" height="48" rx="12" fill="#f4f7fd"/>
      <circle cx="120" cy="180" r="15" fill="url(#blue)"/>
      <rect x="146" y="170" width="120" height="9" rx="4.5" fill="#cfd8ea"/>
      <rect x="146" y="186" width="78" height="8" rx="4" fill="#e2e8f4"/>
      <rect x="310" y="172" width="54" height="17" rx="8.5" fill="#00c9a7" opacity=".2"/>
      <rect x="320" y="178" width="34" height="5" rx="2.5" fill="#00a98d"/>
    </g>
    <g>
      <rect x="94" y="214" width="282" height="48" rx="12" fill="#f4f7fd"/>
      <circle cx="120" cy="238" r="15" fill="url(#teal)"/>
      <rect x="146" y="228" width="140" height="9" rx="4.5" fill="#cfd8ea"/>
      <rect x="146" y="244" width="64" height="8" rx="4" fill="#e2e8f4"/>
      <rect x="310" y="230" width="54" height="17" rx="8.5" fill="#2f6bff" opacity=".16"/>
      <rect x="320" y="236" width="34" height="5" rx="2.5" fill="#2f6bff"/>
    </g>
    <g>
      <rect x="94" y="272" width="282" height="48" rx="12" fill="#f4f7fd"/>
      <circle cx="120" cy="296" r="15" fill="#8e9bbd"/>
      <rect x="146" y="286" width="104" height="9" rx="4.5" fill="#cfd8ea"/>
      <rect x="146" y="302" width="88" height="8" rx="4" fill="#e2e8f4"/>
      <rect x="310" y="288" width="54" height="17" rx="8.5" fill="#8e9bbd" opacity=".18"/>
      <rect x="320" y="294" width="34" height="5" rx="2.5" fill="#6b7795"/>
    </g>

    <rect x="94" y="338" width="130" height="22" rx="11" fill="url(#blue)"/>
    <rect x="236" y="338" width="90" height="22" rx="11" fill="#e6ecf8"/>
  </g>

  <!-- stats card -->
  <g>
    <rect x="350" y="200" width="190" height="150" rx="18" fill="#fff"/>
    <rect x="350" y="200" width="190" height="150" rx="18" fill="none" stroke="#e4e8f0" stroke-width="2"/>
    <rect x="374" y="226" width="78" height="9" rx="4.5" fill="#dde4f1"/>
    <text x="374" y="272" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#131a2b">96%</text>
    <rect x="374" y="300" width="22" height="26" rx="5" fill="#dfe7f8"/>
    <rect x="404" y="288" width="22" height="38" rx="5" fill="#9fb9ff"/>
    <rect x="434" y="296" width="22" height="30" rx="5" fill="#dfe7f8"/>
    <rect x="464" y="278" width="22" height="48" rx="5" fill="url(#blue)"/>
    <rect x="494" y="292" width="22" height="34" rx="5" fill="#dfe7f8"/>
  </g>

  <!-- hire badge -->
  <g>
    <rect x="392" y="110" width="150" height="62" rx="16" fill="#060b1d"/>
    <circle cx="422" cy="141" r="15" fill="url(#teal)"/>
    <path d="M416 141l4 4 8-8" stroke="#06231c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="446" y="130" width="76" height="8" rx="4" fill="#fff" opacity=".9"/>
    <rect x="446" y="146" width="50" height="7" rx="3.5" fill="#fff" opacity=".45"/>
  </g>

  <!-- people silhouettes -->
  <g opacity=".9">
    <circle cx="170" cy="432" r="26" fill="url(#blue)"/>
    <path d="M136 492c0-19 15-30 34-30s34 11 34 30z" fill="url(#blue)"/>
    <circle cx="258" cy="440" r="22" fill="#9fb9ff"/>
    <path d="M229 492c0-16 13-26 29-26s29 10 29 26z" fill="#9fb9ff"/>
    <circle cx="336" cy="436" r="24" fill="url(#teal)"/>
    <path d="M305 492c0-17 14-28 31-28s31 11 31 28z" fill="url(#teal)"/>
  </g>
</svg>
